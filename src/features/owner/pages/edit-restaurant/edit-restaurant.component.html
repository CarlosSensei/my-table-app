<div class="create-restaurant-container">

    <div class="page-header">

        <h1>Editar Restaurante</h1>

        <p>Completa la información para editar tu restaurante.</p>

    </div>

    <form [formGroup]="form" (ngSubmit)="save()">

        <div class="form-grid">

            <div class="form-group">

                <label>Nombre</label>

                <input type="text" formControlName="name">

            </div>

            <div class="form-group">

                <label>Tipo de cocina</label>

                <input type="text" formControlName="cuisineType">

            </div>

            <div class="form-group">

                <label>Ciudad</label>

                <input type="text" formControlName="city">

            </div>

            <div class="form-group">

                <label>Dirección</label>

                <input type="text" formControlName="address">

            </div>

            <div class="form-group">

                <label>Teléfono</label>

                <input type="text" formControlName="phone">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input type="email" formControlName="email">

            </div>

            <div class="form-group">

                <label>Hora apertura</label>

                <input type="time" formControlName="openingHour">

            </div>

            <div class="form-group">

                <label>Hora cierre</label>

                <input type="time" formControlName="closingHour">

            </div>

            <div class="form-group">

                <label>Capacidad</label>

                <input type="number" formControlName="capacity">

            </div>

            <div class="form-group">

                <label>Mesas disponibles</label>

                <input type="number" formControlName="availableTables">

            </div>

            <div class="form-group">

                <label>Precio medio</label>

                <input type="number" formControlName="averagePrice">

            </div>

        </div>

        <div class="form-group full-width">

            <label>Descripción</label>

            <textarea rows="5" formControlName="description"></textarea>

        </div>

        <div class="actions">

            <button
                type="button"
                class="secondary-btn"
                routerLink="/owner/restaurants">
                Cancelar
            </button>

            <button
                type="submit"
                class="primary-btn">
                Guardar Cambios
            </button>

        </div>

    </form>

</div>

<div class="form-container">

  <h1>Editar perfil</h1>

  <form
    [formGroup]="form"
    (ngSubmit)="save()">

    <label>Nombre</label>

    <input
      type="text"
      formControlName="name">

    <label>Email</label>

    <input
      type="email"
      formControlName="email">

    <button type="submit">
      Guardar cambios
    </button>

  </form>

</div>
